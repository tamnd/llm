name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          check-latest: true
      # A library release is a tag. There is nothing to upload, so the only
      # thing worth doing before cutting it is proving the tag builds and
      # passes on its own rather than on somebody's working copy.
      - name: test
        run: go test ./...
      - name: vet
        run: go vet ./...
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
